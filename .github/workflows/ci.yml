name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Standalone: GhostVerify must work with no GhostSlice present.
    # The fix-flow integration tests skip in this job (see helpers).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests -q
      - name: Smoke test CLI
        run: PYTHONPATH=src python -m ghostverify --help > /dev/null
  integration:
    # Integration: GhostSlice checked out as a sibling, the layout
    # gsload discovers, so the fix-flow tests run for real.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ghostverify
      - uses: actions/checkout@v4
        with:
          repository: littlestjames82-sys/ghostslice
          path: ghostslice
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run tests (GhostSlice integration live)
        working-directory: ghostverify
        run: PYTHONPATH=src python -m pytest tests -q
